# What port/tools/status_site/server.py writes to /tmp/xsg-live/settings.ini for
# each live run (the game is started with only XSG_CONFIG set).
[renderer]
gs = gpu

[game]
movies = 0
memcard_dir = /tmp/xsg-live/mc

[audio]
enabled = 0

[debug]
headless = 1
gpu_bin = /srv/projects/xsg-i-decomp/port/build/gpu/xsg-gpu
skip_events = 1
pad = 300:START,1100:START,1200:CROSS,1500:CIRCLE*400@60
shot_every = 30
shot_dir = /tmp/xsg-live/frames
stream = /tmp/xsg-live/stream.fifo
timeout = 900
