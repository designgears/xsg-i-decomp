# The Stage 10 headless field recipe (title -> new game -> first field).
#   XSG_CONFIG=port/docs/examples/field-run.ini port/build/xsg
# Replaces: XSG_GS=gpu XSG_GPU_HEADLESS=1 XSG_AUDIO=0 XSG_MPEG=0 XSG_SKIP_EVENTS=1
#           XSG_TIMEOUT=120 XSG_PAD='300:START,...'.  Keys: port/docs/MENU.md.
# The menu would save into this file; copy it first if you keep it pristine.
[renderer]
gs = gpu

[game]
movies = 0

[audio]
enabled = 0

[debug]
headless = 1
skip_events = 1
timeout = 120
pad = 300:START,1100:START,1200:CROSS,1500:CIRCLE*400@60
# shot = 1000,2000,3000,4500,6000
# shot_dir = /tmp/xsg-shots
# fps = 250
