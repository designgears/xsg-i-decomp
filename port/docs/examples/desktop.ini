# A windowed player setup: copy to ~/.config/xsg/settings.ini (or use XSG_CONFIG).
# Everything here can also be changed in the in-game menu (F1).
[display]
fullscreen = 0
window_scale = 2
present = mailbox
aspect = 4:3

[renderer]
gs = gpu
native = 1
native_scale = 4

[game]
fps_limit = 60
movies = 1

[audio]
enabled = 1
master = 80

[overlay]
mode = fps
