# Stage 12 headless battle recipe (STAGE12_BATTLE.md): title -> new game ->
# ST0210 Virtual Tutorial -> talk to KOS-MOS -> "Switch to Real Combat" ->
# the tutorial battle, attacking with SQUARE for ~38000 vblanks.
#   XSG_CONFIG=port/docs/examples/battle-run.ini port/build/xsg
[renderer]
gs = gpu

[game]
movies = 0

[audio]
enabled = 0

[debug]
headless = 1
skip_events = 1
fast_until = 99999
timeout = 560
pad_log = 1
# 4000: walk down-right to KOS-MOS; 4100 talk; 4460 dismiss "Target input
# complete"; DOWN x3 + CIRCLE picks "Switch to Real Combat"; then CIRCLE
# dismisses the tutorial pages and SQUARE attacks.
pad = 300:START,1100:START,1200:CROSS,1500:CIRCLE*60@40,4000:DOWN+RIGHT:40,4100:CIRCLE,4460:CIRCLE,4540:DOWN,4570:DOWN,4600:DOWN,4640:CIRCLE,4760:CIRCLE*10@60,5400:CIRCLE*500@90,5445:SQUARE*500@90
shot_every = 300
shot_dir = port/build/battle-shots
